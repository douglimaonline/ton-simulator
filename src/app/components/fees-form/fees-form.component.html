<ng-container *ngIf="authService.user$ | async as user; else signedOut">
<div *ngIf="planOptions && planOptions.length > 0" class="card app-card shadow-sm">
  <div class="card-header px-3 py-3 d-flex align-items-start justify-content-between gap-2">
    <div>
      <span class="app-eyebrow">Taxas do plano</span>
      <p class="small text-body-secondary mb-0 mt-1">
        Selecione o plano e toque em Editar para alterar as taxas.
      </p>
    </div>
    <div class="text-end flex-shrink-0 account">
      <div class="small text-body-secondary text-truncate">{{ user.email }}</div>
      <button type="button" class="btn btn-link btn-sm p-0" (click)="signOut()">Sair</button>
    </div>
  </div>

  <div class="card-body px-3">
    <div class="row g-2 align-items-end mb-3">
      <div class="col-12 col-sm">
        <app-plan-selector
          [selectedPlan]="selectedPlan"
          [planOptions]="planOptions"
          (planChanged)="planChanged($event)"
        ></app-plan-selector>
      </div>
      <div class="col-12 col-sm-auto d-grid">
        <button
          type="button"
          class="btn px-4"
          [class.btn-accent]="editMode"
          [class.btn-outline-secondary]="!editMode"
          (click)="onClick()"
        >
          {{ editMode ? "Salvar" : "Editar" }}
        </button>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 g-2">
      <div *ngFor="let fee of selectedPlan?.fees; let i = index" class="col">
        <div class="fee-item d-flex align-items-center justify-content-between gap-2">
          <label class="mb-0 text-nowrap" [attr.for]="'fee-' + i">
            {{ i == 0 ? "Débito" : i == 1 ? "À vista" : "Parcelado " + i + "x" }}
          </label>
          <div class="input-group input-group-sm fee-input">
            <input
              [id]="'fee-' + i"
              [disabled]="!editMode"
              inputmode="decimal"
              currencyMask
              [currencyMask]="{
                prefix: '',
                decimal: ',',
                allowNegative: false,
                precision: 2,
                min: 0.0,
                max: 100.0
              }"
              [ngModel]="fee"
              [ngModelOptions]="{ updateOn: 'blur' }"
              (ngModelChange)="onInputChange($event, i)"
              type="text"
              class="form-control text-end tabular"
              (click)="selectAll($event)"
            />
            <span class="input-group-text">%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</ng-container>

<ng-template #signedOut>
  <!-- undefined = still restoring the saved session: show nothing to avoid a flash -->
  <div *ngIf="(authService.user$ | async) === null" class="card app-card shadow-sm">
    <div class="card-body px-3 py-4 text-center">
      <span class="app-eyebrow">Acesso restrito</span>
      <p class="text-body-secondary mt-2 mb-3">
        Somente as contas autorizadas pela plataforma podem editar as taxas.
      </p>
      <button
        type="button"
        class="btn btn-accent px-4"
        [disabled]="signingIn"
        (click)="signIn()"
      >
        {{ signingIn ? "Entrando..." : "Entrar com Google" }}
      </button>
    </div>
  </div>
</ng-template>

<app-modal #modalRef (onConfirm)="handleConfirm()"></app-modal>
<app-loading #loadingRef></app-loading>
<app-toast #toastRef></app-toast>
