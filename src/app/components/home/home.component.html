<header class="app-header">
  <div
    class="container-lg px-2 px-sm-3 py-2 d-flex align-items-center justify-content-between gap-2 header-inner"
  >
    <div class="d-flex align-items-center gap-2 flex-shrink-0 brand">
      <img src="ton-stone.svg" alt="Ton Simulator" />
      <h1 class="h5 fw-bold mb-0">Ton Simulator</h1>
    </div>

    <!-- Desktop: tabs next to the logo; mobile/tablet: below the logo (see CSS) -->
    <nav class="nav app-tabs ms-lg-auto" role="tablist" aria-label="Seções">
      <button
        type="button"
        role="tab"
        class="nav-link"
        [class.active]="activeTab === 'calculator'"
        [attr.aria-selected]="activeTab === 'calculator'"
        aria-controls="tab-calculator"
        (click)="selectTab('calculator')"
      >
        Calculadora
      </button>
      <button
        type="button"
        role="tab"
        class="nav-link"
        [class.active]="activeTab === 'fees'"
        [attr.aria-selected]="activeTab === 'fees'"
        aria-controls="tab-fees"
        (click)="selectTab('fees')"
      >
        Atualizar taxas
      </button>
    </nav>

    <!-- Desktop: theme switch in the header -->
    <app-theme-toggle class="d-none d-lg-inline-flex ms-2"></app-theme-toggle>
  </div>
</header>

<!-- Mobile/tablet: floating theme switch in the bottom-right corner -->
<app-theme-toggle class="d-lg-none" [floating]="true"></app-theme-toggle>

<!-- Mobile/tablet: "voltar ao topo" (back to top) link, shown at the end of the page -->
<a
  href="#"
  class="back-to-top d-lg-none"
  [class.visible]="showBackToTop"
  [attr.aria-hidden]="!showBackToTop"
  [attr.tabindex]="showBackToTop ? 0 : -1"
  aria-label="Voltar ao topo"
  title="Voltar ao topo"
  (click)="scrollToTop($event)"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7" />
  </svg>
  <span>Topo</span>
</a>

<div class="container-lg px-2 px-sm-3 py-2 py-md-4 app-content">
  <section
    id="tab-calculator"
    role="tabpanel"
    class="tab-panel"
    [class.d-none]="activeTab !== 'calculator'"
  >
    <!-- Mobile/tablet: single card that fits in one screenshot -->
    <div class="d-lg-none mobile-calc">
      <app-compact-card [planOptions]="planOptions$ | async"></app-compact-card>
    </div>

    <!-- Desktop: two cards side by side -->
    <div class="d-none d-lg-flex row row-cols-2 g-4">
      <div class="col">
        <app-card
          [planOptions]="planOptions$ | async"
          id="card-own-fees"
        ></app-card>
      </div>
      <div class="col">
        <app-card
          [feesToCostumer]="true"
          [planOptions]="planOptions$ | async"
          id="card-fees-to-costumer"
        ></app-card>
      </div>
    </div>
  </section>

  <section
    id="tab-fees"
    role="tabpanel"
    [class.d-none]="activeTab !== 'fees'"
  >
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <app-fees-form [planOptions]="planOptions$ | async"></app-fees-form>
      </div>
    </div>
  </section>
</div>
