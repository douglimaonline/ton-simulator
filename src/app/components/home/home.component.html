<header class="app-header">
  <div
    class="container-lg px-3 py-2 d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-between gap-2"
  >
    <div class="d-flex align-items-center gap-2">
      <img src="ton-stone.svg" alt="" />
      <h1 class="h5 fw-bold mb-0">Ton Simulator</h1>
    </div>

    <nav class="nav app-tabs" role="tablist" aria-label="Seções">
      <button
        type="button"
        role="tab"
        class="nav-link"
        [class.active]="activeTab === 'calculator'"
        [attr.aria-selected]="activeTab === 'calculator'"
        aria-controls="tab-calculator"
        (click)="selectTab('calculator')"
      >
        Calculadora
      </button>
      <button
        type="button"
        role="tab"
        class="nav-link"
        [class.active]="activeTab === 'fees'"
        [attr.aria-selected]="activeTab === 'fees'"
        aria-controls="tab-fees"
        (click)="selectTab('fees')"
      >
        Atualizar taxas
      </button>
    </nav>
  </div>
</header>

<div class="container-lg px-3 py-3 py-md-4">
  <section
    id="tab-calculator"
    role="tabpanel"
    [class.d-none]="activeTab !== 'calculator'"
  >
    <div class="row row-cols-1 row-cols-lg-2 g-3 g-lg-4">
      <div class="col">
        <app-card
          [planOptions]="planOptions$ | async"
          id="card-own-fees"
        ></app-card>
      </div>
      <div class="col">
        <app-card
          [feesToCostumer]="true"
          [planOptions]="planOptions$ | async"
          id="card-fees-to-costumer"
        ></app-card>
      </div>
    </div>
  </section>

  <section
    id="tab-fees"
    role="tabpanel"
    [class.d-none]="activeTab !== 'fees'"
  >
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <app-fees-form [planOptions]="planOptions$ | async"></app-fees-form>
      </div>
    </div>
  </section>
</div>
