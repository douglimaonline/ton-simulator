<div class="dropdown app-dropdown w-100">
  <button
    class="btn btn-secondary dropdown-toggle w-100"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <span class="text-truncate">{{ selectedPlan?.title }}</span>
  </button>
  <ul class="dropdown-menu w-100 shadow">
    <li *ngFor="let option of planOptions">
      <button
        type="button"
        class="dropdown-item"
        [class.active]="option.id === selectedPlan?.id"
        (click)="onSelect(option)"
      >
        {{ option.title }}
      </button>
    </li>
  </ul>
</div>
