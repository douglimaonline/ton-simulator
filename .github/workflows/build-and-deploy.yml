name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required permissions for deploy-pages (id token + all write)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          NG_APP_PUBLIC_FIREBASE_API_KEY=${{ secrets.NG_APP_PUBLIC_FIREBASE_API_KEY }}
          NG_APP_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NG_APP_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NG_APP_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_PROJECT_ID }}
          NG_APP_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NG_APP_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NG_APP_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NG_APP_PUBLIC_FIREBASE_APP_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_APP_ID }}
          EOF
        shell: bash

      - name: Check environment secrets
        run: |
          if [ -z "${{ secrets.NG_APP_PUBLIC_FIREBASE_API_KEY }}" ]; then
            echo "MISSING: NG_APP_PUBLIC_FIREBASE_API_KEY"
            exit 1
          else
            echo "FOUND: NG_APP_PUBLIC_FIREBASE_API_KEY"
          fi

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          allow_empty_commit: true