name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required permissions for deploy-pages (id token + pages write)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          NG_APP_PUBLIC_FIREBASE_API_KEY=${{ secrets.NG_APP_PUBLIC_FIREBASE_API_KEY }}
          NG_APP_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NG_APP_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NG_APP_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_PROJECT_ID }}
          NG_APP_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NG_APP_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NG_APP_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NG_APP_PUBLIC_FIREBASE_APP_ID=${{ secrets.NG_APP_PUBLIC_FIREBASE_APP_ID }}
          EOF
        shell: bash

      - name: Build (predeploy)
        run: npm run predeploy

      - name: Show docs
        run: |
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          ls -la docs || true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1